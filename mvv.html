<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVV | TEAMOS</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   "Noto Sans JP", sans-serif;
      background: #ffffff;
      color: #0b2c5f;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(255,255,255,.96);
      border-bottom: 1px solid #e5eaf0;
    }

    .nav {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo img {
      width: 210px;
      height: auto;
    }

    nav {
      display: flex;
      gap: 24px;
      font-size: 14px;
      font-weight: 700;
    }

    nav a {
      text-decoration: none;
      color: #0b2c5f;
    }

    .page-title {
      text-align: center;
      padding: 56px 20px 26px;
    }

    .page-title small {
      color: #0879f9;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .page-title h1 {
      font-size: 42px;
      margin-top: 6px;
    }

    .mvv-image {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    .mvv-image img {
      width: 100%;
      height: auto;
      display: block;
    }

    footer {
      text-align: center;
      padding: 28px;
      background: #061f46;
      color: #fff;
      font-size: 13px;
    }

    @media(max-width: 800px) {
      nav {
        gap: 12px;
        font-size: 12px;
      }

      .logo img {
        width: 160px;
      }

      .page-title h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="nav">
    <a href="index.html#top" class="logo">
      <img src="assets/teamos-logo.png" alt="TEAMOS">
    </a>

    <nav>
      <a href="index.html#top">TOP</a>
      <a href="index.html#services">事業紹介</a>
      <a href="mvv.html">MVV</a>
      <a href="index.html#message">代表挨拶</a>
      <a href="index.html#news">ニュース</a>
      <a href="index.html#recruit">採用情報</a>
      <a href="index.html#contact">お問い合わせ</a>
    </nav>
  </div>
</header>

<section class="page-title">
  <small>MISSION / VISION / VALUE</small>
  <h1>TEAMOS MVV</h1>
</section>

<main class="mvv-image">
  <img src="assets/teamos-mvv.png" alt="TEAMOS Mission Vision Value">
</main>

<footer>
  © 2026 TEAMOS Inc.
</footer>

</body>
</html>
